networks:
  traceforge:
    driver: bridge

volumes:
  postgres_data:
  loki_data:
  grafana_data:

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL — persistent store for orders and users
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: otelpoc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d otelpoc"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - traceforge

  # ─────────────────────────────────────────────────────────────────────────────
  # Jaeger — distributed trace storage and UI
  # Access the UI at http://localhost:16686
  # ─────────────────────────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    ports:
      - "16686:16686" # Jaeger UI
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - traceforge

  # ─────────────────────────────────────────────────────────────────────────────
  # OpenTelemetry Collector — central telemetry gateway
  #
  # Receives OTLP from all services on :4317 (gRPC) and :4318 (HTTP).
  # Three separate pipelines:
  #   traces  → Jaeger
  #   metrics → Prometheus scrape endpoint (:8889)
  #   logs    → Loki
  # ─────────────────────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC (services → collector)
      - "4318:4318" # OTLP HTTP (alternative protocol)
      - "8889:8889" # Prometheus scrape endpoint
      - "13133:13133" # Health check endpoint
    depends_on:
      jaeger:
        condition: service_healthy
      loki:
        condition: service_healthy
    restart: on-failure
    networks:
      - traceforge

  # ─────────────────────────────────────────────────────────────────────────────
  # Loki — log aggregation backend
  #
  # Receives structured logs from the OTel Collector via HTTP push API (:3100).
  # Each log record carries trace_id and span_id, enabling click-through to Jaeger.
  # Access logs through Grafana Explore: http://localhost:3000/explore
  # ─────────────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - traceforge

  # ─────────────────────────────────────────────────────────────────────────────
  # Prometheus — metrics scrape, storage, and query engine
  # Access the UI at http://localhost:9090
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - traceforge

  # ─────────────────────────────────────────────────────────────────────────────
  # Grafana — dashboards and visualisation
  # Access the UI at http://localhost:3000  (admin / admin)
  #
  # Pre-provisioned datasources: Prometheus, Jaeger
  # Pre-provisioned dashboards:  TraceForge — Platform Overview
  # ─────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_LOG_LEVEL=warn
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - traceforge

  # ─────────────────────────────────────────────────────────────────────────────
  # Gateway Service — single public entry point
  # Calls user-service and order-service, propagating trace context.
  # Access at http://localhost:8080
  # ─────────────────────────────────────────────────────────────────────────────
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: gateway-service
      SERVICE_PORT: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      USER_SERVICE_URL: http://user-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
    depends_on:
      otel-collector:
        condition: service_started
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - traceforge

  # ─────────────────────────────────────────────────────────────────────────────
  # User Service — internal user lookup (in-memory store)
  # Not exposed publicly — only the gateway reaches it.
  # ─────────────────────────────────────────────────────────────────────────────
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SERVICE_NAME: user-service
      SERVICE_PORT: "8081"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - traceforge

  # ─────────────────────────────────────────────────────────────────────────────
  # Order Service — creates orders in PostgreSQL
  # Demonstrates DB instrumentation with OTel spans.
  # ─────────────────────────────────────────────────────────────────────────────
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SERVICE_NAME: order-service
      SERVICE_PORT: "8082"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: otelpoc
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - traceforge
