# ──────────────────────────────────────────────────────────────────────────────
# OpenTelemetry Collector — TraceForge Configuration
#
# The Collector is the central telemetry gateway. Services send all three
# signal types (traces, metrics, logs) here via OTLP, and the Collector
# fans them out to the appropriate backend.
#
# Signal → Backend mapping:
#   traces  → Jaeger      (via OTLP gRPC)
#   metrics → Prometheus  (via scrape endpoint on :8889)
#   logs    → Loki        (via Loki HTTP push API)
#
# Pipeline structure:  receivers → processors → exporters
# ──────────────────────────────────────────────────────────────────────────────

# ── Receivers ─────────────────────────────────────────────────────────────────
# OTLP receiver accepts all three signal types from all services.
# Services connect via gRPC (4317) or HTTP (4318).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# ── Processors ────────────────────────────────────────────────────────────────
processors:
  # Memory limiter — prevents OOM under traffic spikes.
  # Must be the first processor in every pipeline.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Batch processor — buffers telemetry and flushes in bulk.
  # Reduces network round-trips and backend write amplification.
  batch:
    timeout: 2s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Resource processor — stamps every telemetry item with project-level
  # attributes that are not set per-service (e.g. environment, stack name).
  resource:
    attributes:
      - action: insert
        key: deployment.environment
        value: development
      - action: insert
        key: project
        value: traceforge
      - action: insert
        key: collector.version
        value: "0.104.0"

# ── Exporters ─────────────────────────────────────────────────────────────────
exporters:
  # Debug — logs a summary of each received telemetry item to collector stdout.
  # Set verbosity to "detailed" for full attribute dumps during development.
  debug:
    verbosity: basic

  # Jaeger — receives traces via OTLP gRPC. Jaeger ≥ 1.35 speaks OTLP natively.
  # "jaeger" resolves to the jaeger container via Docker's internal DNS.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Prometheus — exposes received metrics as a scrape endpoint at :8889.
  # Prometheus is configured to scrape this endpoint every 10 s.
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otelcol
    send_timestamps: true
    metric_expiration: 5m

  # Loki — receives structured log records via the HTTP push API.
  # The job label is derived from service.name (OTel convention), so every
  # service's logs are queryable in Grafana Explore as {job="<service-name>"}.
  # Each log line carries trace_id and span_id for click-through to Jaeger.
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: false   # omit "exporter=otlp" label (low-value cardinality)
      job: true         # maps service.name → job label (standard Loki label)
      instance: false   # omit instance label (single-node dev setup)
      level: true       # maps log severity → level label for severity filtering

# ── Extensions ────────────────────────────────────────────────────────────────
extensions:
  # Health check endpoint — returns 200 when the collector is ready.
  health_check:
    endpoint: 0.0.0.0:13133

  # pprof — allows CPU/heap profiling of the collector process.
  pprof:
    endpoint: 0.0.0.0:1777

# ── Service ───────────────────────────────────────────────────────────────────
service:
  extensions: [health_check, pprof]

  pipelines:
    # ── Traces ──────────────────────────────────────────────────────────────
    # Flow: services → [OTLP:4317] → memory_limiter → resource → batch → Jaeger
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug, otlp/jaeger]

    # ── Metrics ─────────────────────────────────────────────────────────────
    # Flow: services → [OTLP:4317] → memory_limiter → resource → batch → prometheus
    # Prometheus scrapes the :8889 endpoint. Grafana queries Prometheus.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug, prometheus]

    # ── Logs ────────────────────────────────────────────────────────────────
    # Flow: services → [OTLP:4317] → memory_limiter → resource → batch → Loki
    # Each log record carries trace_id and span_id for correlation with traces.
    # In Grafana Explore, filter by {job="service-name"} or search by trace_id.
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug, loki]

  telemetry:
    logs:
      level: warn
    metrics:
      address: 0.0.0.0:8888
