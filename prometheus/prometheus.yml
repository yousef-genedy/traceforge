# ──────────────────────────────────────────────────────────────────────────────
# Prometheus Configuration — TraceForge
#
# Prometheus uses a pull model: it scrapes HTTP /metrics endpoints on a schedule.
# Each Go service exposes its OTel metrics at /metrics via the OTel prometheus
# exporter (registered with the default prometheus registry).
#
# Grafana queries Prometheus for dashboards via the configured datasource.
# ──────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

  external_labels:
    environment: development
    project: traceforge

scrape_configs:
  # ── Gateway Service ──────────────────────────────────────────────────────────
  - job_name: "gateway-service"
    static_configs:
      - targets: ["gateway-service:8080"]
    metrics_path: /metrics
    scrape_interval: 10s

  # ── User Service ─────────────────────────────────────────────────────────────
  - job_name: "user-service"
    static_configs:
      - targets: ["user-service:8081"]
    metrics_path: /metrics
    scrape_interval: 10s

  # ── Order Service ────────────────────────────────────────────────────────────
  - job_name: "order-service"
    static_configs:
      - targets: ["order-service:8082"]
    metrics_path: /metrics
    scrape_interval: 10s

  # ── OTel Collector ───────────────────────────────────────────────────────────
  # Exposes metrics received via OTLP plus the collector's own internal metrics
  # (spans received, export errors, memory usage, etc.).
  # The "otelcol_" prefix is set by namespace: otelcol in collector config.
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
    metrics_path: /metrics
    scrape_interval: 10s

  # ── Prometheus self-monitoring ───────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s
